    <text x="64" y="210" fill="#70e9da" font-family="Arial,sans-serif" font-size="15" font-weight="900" letter-spacing="3">BEFORE / AFTER</text>
    <text x="64" y="286" fill="#f4fbff" font-family="'Microsoft YaHei','Noto Sans SC','PingFang SC',Arial,sans-serif" font-size="65" font-weight="900" text-anchor="start" letter-spacing="0"><tspan x="64" dy="0">同一个项目，</tspan><tspan x="64" dy="76">两种写法。</tspan></text>
    <text x="64" y="448" fill="#b9cedd" font-family="'Microsoft YaHei','Noto Sans SC','PingFang SC',Arial,sans-serif" font-size="27" font-weight="700">招聘方能看到的，不一样。</text>
