    <text x="64" y="1185" fill="#f0f8fb" font-family="'Microsoft YaHei','Noto Sans SC','PingFang SC',Arial,sans-serif" font-size="28" font-weight="850">造途做的不是“美化”，而是把真实经历讲清楚。</text>
    <text x="64" y="1234" fill="#8da7b9" font-family="'Microsoft YaHei','Noto Sans SC','PingFang SC',Arial,sans-serif" font-size="19">只使用本人确认的职业资产，不生成雇主、证书、年限或成果。</text>
