    <text x="64" y="210" fill="#70e9da" font-family="Arial,sans-serif" font-size="15" font-weight="900" letter-spacing="3">HOW IT WORKS</text>
    <text x="64" y="286" fill="#f4fbff" font-family="'Microsoft YaHei','Noto Sans SC','PingFang SC',Arial,sans-serif" font-size="61" font-weight="900" text-anchor="start" letter-spacing="0"><tspan x="64" dy="0">20–30 分钟，</tspan><tspan x="64" dy="72">跑完一条真实链路。</tspan></text>
    <g transform="translate(64 410)"><rect width="952" height="98" rx="22" fill="#071b29" fill-opacity=".84" stroke="#56d9e8" stroke-opacity=".20"/><rect x="20" y="19" width="60" height="60" rx="18" fill="#238e81" fill-opacity=".55"/><text x="50" y="57" text-anchor="middle" fill="#eaffff" font-family="Arial,sans-serif" font-size="18" font-weight="900">01</text><text x="104" y="43" fill="#effcff" font-family="'Microsoft YaHei','Noto Sans SC','PingFang SC',Arial,sans-serif" font-size="22" font-weight="850">职业资料</text><text x="104" y="72" fill="#87a4b7" font-family="'Microsoft YaHei','Noto Sans SC','PingFang SC',Arial,sans-serif" font-size="16">整理真实且可脱敏的经历</text><path d="M878 49H918M904 35L918 49L904 63" fill="none" stroke="#62dccf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(64 535)"><rect width="952" height="98" rx="22" fill="#071b29" fill-opacity=".84" stroke="#56d9e8" stroke-opacity=".20"/><rect x="20" y="19" width="60" height="60" rx="18" fill="#347dbe" fill-opacity=".55"/><text x="50" y="57" text-anchor="middle" fill="#eaffff" font-family="Arial,sans-serif" font-size="18" font-weight="900">02</text><text x="104" y="43" fill="#effcff" font-family="'Microsoft YaHei','Noto Sans SC','PingFang SC',Arial,sans-serif" font-size="22" font-weight="850">完整 JD</text><text x="104" y="72" fill="#87a4b7" font-family="'Microsoft YaHei','Noto Sans SC','PingFang SC',Arial,sans-serif" font-size="16">看岗位要求与证据缺口</text><path d="M878 49H918M904 35L918 49L904 63" fill="none" stroke="#62dccf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(64 660)"><rect width="952" height="98" rx="22" fill="#071b29" fill-opacity=".84" stroke="#56d9e8" stroke-opacity=".20"/><rect x="20" y="19" width="60" height="60" rx="18" fill="#238e81" fill-opacity=".55"/><text x="50" y="57" text-anchor="middle" fill="#eaffff" font-family="Arial,sans-serif" font-size="18" font-weight="900">03</text><text x="104" y="43" fill="#effcff" font-family="'Microsoft YaHei','Noto Sans SC','PingFang SC',Arial,sans-serif" font-size="22" font-weight="850">双视角预审</text><text x="104" y="72" fill="#87a4b7" font-family="'Microsoft YaHei','Noto Sans SC','PingFang SC',Arial,sans-serif" font-size="16">HR 与技术主管分别检查</text><path d="M878 49H918M904 35L918 49L904 63" fill="none" stroke="#62dccf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(64 785)"><rect width="952" height="98" rx="22" fill="#071b29" fill-opacity=".84" stroke="#56d9e8" stroke-opacity=".44"/><rect x="20" y="19" width="60" height="60" rx="18" fill="#347dbe" fill-opacity=".55"/><text x="50" y="57" text-anchor="middle" fill="#eaffff" font-family="Arial,sans-serif" font-size="18" font-weight="900">04</text><text x="104" y="43" fill="#effcff" font-family="'Microsoft YaHei','Noto Sans SC','PingFang SC',Arial,sans-serif" font-size="22" font-weight="850">正式 Word</text><text x="104" y="72" fill="#87a4b7" font-family="'Microsoft YaHei','Noto Sans SC','PingFang SC',Arial,sans-serif" font-size="16">生成可编辑岗位材料</text><path d="M878 49H918M904 35L918 49L904 63" fill="none" stroke="#62dccf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(64 910)"><rect width="952" height="98" rx="22" fill="#071b29" fill-opacity=".84" stroke="#56d9e8" stroke-opacity=".20"/><rect x="20" y="19" width="60" height="60" rx="18" fill="#238e81" fill-opacity=".55"/><text x="50" y="57" text-anchor="middle" fill="#eaffff" font-family="Arial,sans-serif" font-size="18" font-weight="900">05</text><text x="104" y="43" fill="#effcff" font-family="'Microsoft YaHei','Noto Sans SC','PingFang SC',Arial,sans-serif" font-size="22" font-weight="850">匿名反馈</text><text x="104" y="72" fill="#87a4b7" font-family="'Microsoft YaHei','Noto Sans SC','PingFang SC',Arial,sans-serif" font-size="16">只交问题，不交简历原件</text><path d="M878 49H918M904 35L918 49L904 63" fill="none" stroke="#62dccf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g transform="translate(64 1070)" filter="url(#cardShadow)">
      <rect width="952" height="220" rx="28" fill="#0b2030" fill-opacity=".94" stroke="#5fe3d2" stroke-opacity=".34"/>
      <text x="30" y="50" fill="#6ce7d7" font-family="'Microsoft YaHei','Noto Sans SC','PingFang SC',Arial,sans-serif" font-size="20" font-weight="900">资料如何被处理</text>
      <text x="30" y="92" fill="#d0e1ea" font-family="'Microsoft YaHei','Noto Sans SC','PingFang SC',Arial,sans-serif" font-size="18">职业资料默认保存在浏览器。</text>
      <text x="30" y="127" fill="#d0e1ea" font-family="'Microsoft YaHei','Noto Sans SC','PingFang SC',Arial,sans-serif" font-size="18">生成 Word 时，本次所需资料经一次性 HTTPS 请求在服务端内存处理后返回。</text>
      <text x="30" y="162" fill="#91aabc" font-family="'Microsoft YaHei','Noto Sans SC','PingFang SC',Arial,sans-serif" font-size="17">不建账户 · 不做数据库同步或长期保存 · 不需要发送简历、JD 或 Word/PDF 原件</text>
      <line x1="30" y1="184" x2="922" y2="184" stroke="#57d8d0" stroke-opacity=".19"/>
      <text x="30" y="208" fill="#7cded1" font-family="'Microsoft YaHei','Noto Sans SC','PingFang SC',Arial,sans-serif" font-size="14" font-weight="800">匿名反馈包不含职业资料、联系方式、JD 或材料正文</text>
