<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440" role="img">

  <defs>
    <linearGradient id="brandGradient" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7b63ff"/><stop offset=".5" stop-color="#2d9cff"/><stop offset="1" stop-color="#27e0b8"/></linearGradient>
    <linearGradient id="cyanGradient" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#4af2cf"/><stop offset="1" stop-color="#5ca8ff"/></linearGradient>
    <linearGradient id="warningGradient" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff5b45"/><stop offset="1" stop-color="#ff9a3d"/></linearGradient>
    <linearGradient id="bottomFade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#071421" stop-opacity="0"/><stop offset=".58" stop-color="#06101c" stop-opacity=".74"/><stop offset="1" stop-color="#030912" stop-opacity=".98"/></linearGradient>
    <radialGradient id="cyanGlow"><stop stop-color="#31d8ef" stop-opacity=".30"/><stop offset="1" stop-color="#31d8ef" stop-opacity="0"/></radialGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="12" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000814" flood-opacity=".48"/></filter>
    <pattern id="microGrid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#6bdcf2" stroke-opacity=".07" stroke-width="1"/></pattern>
  </defs>
  <rect width="1080" height="1440" fill="#04101c"/>
