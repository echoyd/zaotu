    <path d="M45 38V49M39.5 43.5H50.5" stroke="#efffff" stroke-width="2.6" stroke-linecap="round"/>
    <text x="80" y="27" fill="#f2fbff" font-family="'Microsoft YaHei','Noto Sans SC','PingFang SC',Arial,sans-serif" font-size="27" font-weight="850">造途 ZAOTU</text>
    <text x="81" y="51" fill="#77d9e8" font-family="Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="2.5">ENGINEERING CAREER OS</text>
