  <rect width="1080" height="1440" fill="url(#microGrid)"/>
  <rect width="1080" height="1440" fill="url(#bottomFade)"/>
  <ellipse cx="190" cy="480" rx="430" ry="520" fill="#03101d" opacity=".78"/>


  <g transform="translate(64 60)">
    <rect width="62" height="62" rx="19" fill="url(#brandGradient)"/>
    <path d="M16 20H45L20 44H47" fill="none" stroke="#efffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
