[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zaotu-public"
version = "0.1.0"
description = "Privacy-first engineering career evidence and JD matching beta"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0,<4.0",
    "pydantic>=2.0,<3.0",
    "python-docx>=1.1,<2.0",
    "Pillow>=10.0,<12.0",
    "python-multipart>=0.0.9,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-p", "no:cacheprovider"]
